# =============================================================================
# monitoring/prometheus.yml - scrape + alerting configuration.
#
# Phase 7 (Conteneurisation) declared the api scrape job. Phase 8 (Monitoring
# & Drift) wires the alerting rules from ``alerts.yml`` and adds the scrape
# job for the new ``drift-monitor`` service that exposes embedding drift +
# OOD rate gauges on :9091.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: deepvision-cifar10-classifier
    env: dev

# Phase 8 - alerting rules loaded from a sibling file mounted into the
# container at /etc/prometheus/alerts.yml.
rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # -- The deepvision FastAPI inference service (Phase 5) -------------------
  - job_name: deepvision-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "api:8000"
        labels:
          service: api
          component: serving

  # -- The deepvision drift-monitor exporter (Phase 8) ----------------------
  # Reuses the api Docker image with a different entrypoint
  # (``python -m deepvision drift-monitor``); exposes Prometheus on :9091.
  - job_name: deepvision-drift-monitor
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "drift-monitor:9091"
        labels:
          service: drift-monitor
          component: monitoring

  # -- Prometheus self-scrape (sanity check) --------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: prometheus
